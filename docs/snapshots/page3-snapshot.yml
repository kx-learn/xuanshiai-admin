        - generic [ref=f1e163]:
          - generic [ref=f1e164]:
            - generic [ref=f1e165]: 须知
            - generic [ref=f1e167]: 1、合伙红娘（简称：合伙人）是同城相亲平台中的一种“合作”角色，合伙人通过为平台大量发展推广红娘作从而为平台快速且可持续性拓展会员和变现，合伙人从中获得分成奖励。 2、合伙人可以是拥有众多单身资源，兼职红娘渠道的的个人或者机构，每个合伙人被视为一个团队，可以自定义一个团队名称，其发展来的推广红娘被纳入为团队成员，旗下推广红娘所发展来的会员在平台上产生的消费总额度成为团队业绩，系统根据其团队业绩或发展会员数量将合伙人划分为三个不同级别，不同的级别享有不同的分佣标准（级别和分佣标准均可自定义设置） 3、合伙人除了能拿到所有团队成员发展来的会员的注册奖励之外,团队成员发展来的相亲会员在平台中每一笔消费，合伙人都可以获得分佣 4、合伙人拥有独立的管理中心，团队成员名单、业绩明细、分佣明细、有效相亲会员名单均清晰透明可见，分佣金额可随时申请提现到微信零钱 5、推广红娘可以与合伙人身份并存，但不得是服务红娘，如果合伙人本身已经是推广红娘且未加入其他团队情况下，或在成为合伙人之后成为推广红娘，则自动加入到自己的团队中。且可在推广红娘中心切换登录到合伙人管理中心 6、平台支持在线付费自助开通、联系平台人工开通合伙人两种形式（在“平台配置-收费配置”中设置），由平台管理人员在“系统后台-合伙人管理”中开通账号与对应权限 7、推广红娘在加入团队之前，必须先在平台注册账号，再申请成为推广红娘，推广红娘在登录状态下微信扫合伙人码后即可加入到合伙人团队 8、每个合伙人拥有独立的邀请二维码，别人扫合伙人二维码后，进入平台，只要注册为用户，即可绑定关系。任何时候注册为推广红娘，都自动加入到之前扫码的那个合伙人团队 9、团队成员：合伙人团队中的推广红娘；团队业绩：合伙人团队所有推广红娘发展来的相亲会员在平台中的消费总额；团队有效会员： 合伙人团队所有推广红娘发展来的通过资料审核的相亲会员；累积分成：合伙人获得的分成总额
